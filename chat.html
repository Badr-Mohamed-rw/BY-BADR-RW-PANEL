<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат — By Badr</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="panel.css">
    <style>
        .chat-page { max-width: 900px; margin: 0 auto; }
        .chat-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-wrap: wrap;
            padding: 18px 22px;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            margin-bottom: 16px;
        }
        .chat-head h2 { font-size: 20px; margin: 0; }
        .chat-head .right { display: flex; align-items: center; gap: 12px; }
        .chat-online {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(46,204,113,0.15);
            border: 1px solid rgba(46,204,113,0.35);
            color: #2ecc71;
            padding: 6px 14px; border-radius: 30px;
            font-size: 13px; font-weight: 600;
        }
        .chat-online::before {
            content: ''; width: 8px; height: 8px; border-radius: 50%;
            background: #2ecc71; box-shadow: 0 0 8px #2ecc71;
            animation: onlinePulse 1.5s infinite;
        }
        @keyframes onlinePulse { 50% { opacity: 0.4; } }
        .chat-me {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 13px; color: rgba(255,255,255,0.7);
        }
        .chat-me .nick { color: #5dade2; font-weight: 700; }
        .chat-change-nick {
            background: transparent; border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.7);
            padding: 4px 12px; border-radius: 8px;
            font-size: 11px; cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            transition: 0.2s;
        }
        .chat-change-nick:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .chat-wrap {
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            display: flex; flex-direction: column;
            height: calc(100vh - 320px);
            min-height: 400px;
            overflow: hidden;
        }
        .chat-list {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 14px;
            scroll-behavior: smooth;
        }
        .chat-list::-webkit-scrollbar { width: 8px; }
        .chat-list::-webkit-scrollbar-track { background: transparent; }
        .chat-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15); border-radius: 4px;
        }
        .chat-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        .chat-msg { display: flex; gap: 10px; }
        .chat-msg-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(93,173,226,0.2);
            color: #5dade2;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 15px;
            flex-shrink: 0;
            border: 1px solid rgba(93,173,226,0.3);
        }
        .chat-msg-avatar-admin {
            background: linear-gradient(135deg, #5dade2, #9b59b6);
            color: #fff;
            border-color: rgba(255,255,255,0.3);
        }
        .chat-msg-body { flex: 1; min-width: 0; }
        .chat-msg-head {
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 4px; font-size: 13px;
        }
        .chat-msg-nick { font-weight: 700; color: #fff; }
        .chat-msg-check {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; border-radius: 50%;
            background: #5dade2; color: #fff;
        }
        .chat-msg-time { margin-left: 6px; color: rgba(255,255,255,0.35); font-size: 11px; }
        .chat-msg-text {
            font-size: 14px; color: rgba(255,255,255,0.9);
            line-height: 1.5; word-break: break-word; white-space: pre-wrap;
        }
        .chat-msg-reply {
            background: rgba(93,173,226,0.08);
            border-left: 3px solid #5dade2;
            padding: 6px 10px; margin-bottom: 6px;
            border-radius: 6px;
            font-size: 12px; color: rgba(255,255,255,0.7);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .chat-msg-reply b { color: #5dade2; margin-right: 4px; }
        .chat-msg-photo { display: inline-block; margin-top: 8px; max-width: 320px; }
        .chat-msg-photo img {
            width: 100%; border-radius: 12px; display: block;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: zoom-in;
        }
        .chat-msg-actions { margin-top: 6px; }
        .chat-msg-reply-btn {
            background: transparent; border: none;
            color: rgba(255,255,255,0.35);
            font-size: 11px; cursor: pointer;
            padding: 2px 0; font-family: 'Montserrat', sans-serif;
        }
        .chat-msg-reply-btn:hover { color: #5dade2; }

        .chat-reply-box {
            display: none;
            align-items: center; gap: 10px;
            padding: 10px 20px;
            background: rgba(93,173,226,0.08);
            border-top: 1px solid rgba(93,173,226,0.2);
            font-size: 13px;
        }
        .chat-reply-box .reply-info { flex: 1; overflow: hidden; }
        .chat-reply-box .reply-nick {
            color: #5dade2; font-weight: 700; font-size: 12px;
        }
        .chat-reply-box .reply-text {
            color: rgba(255,255,255,0.6); font-size: 12px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .chat-reply-box button {
            background: transparent; border: none;
            color: rgba(255,255,255,0.5); cursor: pointer;
            font-size: 16px; padding: 4px 8px;
        }
        .chat-reply-box button:hover { color: #e74c3c; }

        .chat-preview {
            display: none;
            align-items: center; gap: 10px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .chat-preview img {
            max-height: 60px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .chat-preview button {
            background: rgba(231,76,60,0.2);
            border: 1px solid rgba(231,76,60,0.4);
            color: #e74c3c; cursor: pointer;
            width: 28px; height: 28px; border-radius: 50%;
            font-size: 14px;
        }

        .chat-form {
            display: flex; gap: 10px; align-items: flex-end;
            padding: 14px 16px;
            border-top: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.35);
        }
        .chat-form textarea {
            flex: 1; resize: none;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px 14px;
            color: #fff; font-family: 'Montserrat', sans-serif;
            font-size: 14px; outline: none;
            min-height: 42px; max-height: 140px;
            transition: 0.25s;
        }
        .chat-form textarea:focus { border-color: rgba(93,173,226,0.6); }
        .chat-form button {
            background: rgba(93,173,226,0.2);
            border: 1px solid rgba(93,173,226,0.5);
            color: #5dade2;
            width: 42px; height: 42px; border-radius: 12px;
            font-size: 16px; cursor: pointer;
            transition: 0.25s;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .chat-form button:hover { background: rgba(93,173,226,0.4); color: #fff; }
        .chat-form button:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-form .send-btn {
            background: #5dade2; color: #fff;
            border-color: #5dade2;
        }
        .chat-form .send-btn:hover { background: #4a90c9; }

        .chat-status {
            position: absolute; bottom: 8px; left: 50%;
            transform: translateX(-50%);
            font-size: 12px; color: #e74c3c;
        }

        @media (max-width: 768px) {
            .chat-wrap { height: calc(100vh - 260px); }
            .chat-head { padding: 14px 16px; }
            .chat-head h2 { font-size: 17px; }
            .chat-list { padding: 14px; gap: 12px; }
            .chat-msg-avatar { width: 32px; height: 32px; font-size: 13px; }
            .chat-form { padding: 10px 12px; gap: 8px; }
            .chat-form button { width: 38px; height: 38px; }
        }
    </style>
</head>
<script src="cookie-banner.js"></script>
<script src="visual.js"></script>
<script src="api.js"></script>
<body>

<div class="site-bg"></div>
<div class="site-overlay"></div>

<header>
    <div class="logo-wrap">
        <img src="Images/logo.svg" class="logo" alt="By Badr">
        <span>BY BADR</span>
    </div>
    <nav>
        <a href="index.html">Главная</a>
        <a href="shop.html">Магазин</a>
        <a href="order.html">Заказать лаунчер</a>
        <a href="panel.html">Панель</a>
        <a href="chat.html" class="active">Чат</a>
    </nav>
</header>

<main class="content chat-page">
    <div class="chat-head">
        <h2><i class="fa-solid fa-comments" style="color:#5dade2;margin-right:8px;"></i>Общий чат</h2>
        <div class="right">
            <div class="chat-me">
                Ты: <span class="nick" id="chatMeNick">...</span>
                <button class="chat-change-nick" id="chatChangeNick">Сменить</button>
            </div>
            <div class="chat-online">
                <span id="chatOnline">0</span> онлайн
            </div>
        </div>
    </div>

    <div class="chat-wrap">
        <div class="chat-list" id="chatList"></div>

        <div class="chat-reply-box" id="chatReplyBox">
            <div class="reply-info">
                <div class="reply-nick" id="chatReplyNick"></div>
                <div class="reply-text" id="chatReplyText"></div>
            </div>
            <button type="button" id="chatReplyCancel">✕</button>
        </div>

        <div class="chat-preview" id="chatPreview">
            <img id="chatPreviewImg" src="" alt="">
            <button type="button" id="chatPreviewRemove">✕</button>
        </div>

        <form class="chat-form" id="chatForm">
            <button type="button" id="chatFileBtn" onclick="document.getElementById('chatFile').click()">
                <i class="fa-solid fa-image"></i>
            </button>
            <input type="file" id="chatFile" accept="image/*" style="display:none">
            <textarea id="chatInput" placeholder="Напиши сообщение..." rows="1"></textarea>
            <button type="submit" class="send-btn" id="chatSendBtn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
        <div class="chat-status" id="chatStatus"></div>
    </div>
</main>

<script>
(async function () {
    var me = await apiGet('me');
    if (!me.ok || !me.user) window.location.href = 'panel.html';
})();
</script>
<script src="chat.js"></script>
<script src="online-counter.js"></script>

</body>
</html>
