<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Значок BB -->
  <g filter="url(#glow)">
    <rect x="20" y="28" width="184" height="184" rx="48" fill="url(#badgeGrad)"/>
  </g>
  <rect x="24" y="32" width="176" height="176" rx="44" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3"/>
  <rect x="28" y="36" width="168" height="168" rx="40" fill="none" stroke="rgba(0,0,0,0.18)" stroke-width="2"/>

  <text x="112" y="156"
        text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="110" font-weight="900" letter-spacing="-4"
        fill="#ffffff">BB</text>

  <!-- BY BADR -->
  <text x="244" y="118"
        font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="82" font-weight="900" letter-spacing="2"
        fill="url(#textGrad)">BY BADR</text>

  <!-- LAUNCHER STUDIO -->
  <text x="248" y="164"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700" letter-spacing="14"
        fill="#22d3ee" opacity="0.95">LAUNCHER STUDIO</text>

  <!-- Линия -->
  <line x1="248" y1="186" x2="780" y2="186"
        stroke="url(#badgeGrad)" stroke-width="4"
        stroke-linecap="round" opacity="0.85"/>
</svg>
