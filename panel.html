<!DOCTYPE html>
<html lang="ru">
<head>
<script>/* kill-tatnet-badge */
(function(){
  "use strict";
  var RE = /^x-[a-z0-9]{4,12}-b$/;

  // 1) Блокируем создание shadow DOM для подозрительных тегов
  var origAS = Element.prototype.attachShadow;
  if (origAS) {
    Element.prototype.attachShadow = function(init){
      var t = this && this.tagName ? String(this.tagName).toLowerCase() : "";
      if (RE.test(t)) {
        throw new DOMException("blocked", "NotSupportedError");
      }
      return origAS.call(this, init);
    };
  }

  // 2) Не даём добавить подозрительный элемент в DOM
  var origAC = Node.prototype.appendChild;
  Node.prototype.appendChild = function(child){
    if (child && child.nodeType === 1 && child.tagName) {
      var t = String(child.tagName).toLowerCase();
      if (RE.test(t)) return child;
    }
    return origAC.call(this, child);
  };

  // 3) Игнорируем MutationObserver-восстановление
  var origObs = window.MutationObserver;
  if (origObs) {
    window.MutationObserver = function(cb){
      var safe = function(muts, obs){
        var filtered = [];
        for (var i = 0; i < muts.length; i++) {
          var m = muts[i];
          if (m.type === "childList" && m.addedNodes && m.addedNodes.length) {
            var bad = false;
            for (var j = 0; j < m.addedNodes.length; j++) {
              var n = m.addedNodes[j];
              if (n && n.nodeType === 1 && n.tagName && RE.test(String(n.tagName).toLowerCase())) {
                bad = true; break;
              }
            }
            if (bad) continue;
          }
          filtered.push(m);
        }
        if (filtered.length) cb(filtered, obs);
      };
      return new origObs(safe);
    };
  }
})();
</script>
    <meta charset="UTF-8">
    <title>Панель — By Badr</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="panel.css">
</head>
<script src="cookie-banner.js"></script>
<script src="visual.js"></script>
<script src="api.js"></script>
<body>

<div class="site-bg"></div>
<div class="site-overlay"></div>

<header>
    <div class="logo-wrap">
        <img src="Images/logo.svg" class="logo" alt="logo">
        <span>BY BADR</span>
    </div>
    <nav>
        <a href="index.html">Главная</a>
        <a href="shop.html">Магазин</a>
        <a href="order.html">Заказать лаунчер</a>
        <a href="panel.html" class="active">Панель</a>
        <a href="chat.html">Чат</a>
        <a href="admin.html" id="adminLink" style="display:none;">Админка</a>
    </nav>
</header>

<main class="content form-container">

    <div id="authBlock">
        <h1>Вход / Регистрация</h1>
        <p class="subtitle">Войди или создай аккаунт</p>

        <div class="tabs">
            <button class="tab active" data-tab="login">Вход</button>
            <button class="tab" data-tab="register">Регистрация</button>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-right-to-bracket"></i> Войти
            </button>
        </form>

        <form id="registerForm" class="auth-form" style="display:none;">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Пароль (мин. 6 символов)</label>
                <input type="password" name="password" required minlength="6">
            </div>

            <label class="consent-label">
                <input type="checkbox" id="consentCheck" required>
                <span>
                    Я согласен с <a href="privacy.html" target="_blank">политикой конфиденциальности</a>
                    и обработкой данных, а также на использование <b>cookie</b> для сохранения сессии.
                </span>
            </label>

            <button type="submit" class="btn-primary">
                <i class="fa-solid fa-user-plus"></i> Зарегистрироваться
            </button>
        </form>

        <div id="authStatus" class="form-status"></div>
    </div>

    <div id="cabinetBlock" style="display:none;">
        <h1>Личный кабинет</h1>
        <p class="subtitle">Привет, <b id="userEmail"></b></p>

        <div class="cabinet-actions">
            <a href="order.html" class="btn-primary">
                <i class="fa-solid fa-plus"></i> Новый заказ
            </a>
            <button id="logoutBtn" class="btn-download">
                <i class="fa-solid fa-right-from-bracket"></i> Выйти
            </button>
        </div>

        <h2 style="margin-top: 40px;">Мои заказы</h2>
        <div id="ordersList" class="orders-list"></div>
    </div>

</main>

<footer>
    <p>© 2026 By Badr · Все лаунчеры бесплатно</p>
    <p class="credits">За основу: <b>Empire State Project</b> · автор <b>shadexqz</b></p>
</footer>

<script>
document.querySelectorAll('.tab').forEach(function (t) {
    t.onclick = function () {
        document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
        t.classList.add('active');
        document.getElementById('loginForm').style.display = (t.dataset.tab === 'login') ? '' : 'none';
        document.getElementById('registerForm').style.display = (t.dataset.tab === 'register') ? '' : 'none';
    };
});

document.getElementById('registerForm').onsubmit = async function (e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    var res = await apiPost('register', { email: fd.get('email'), password: fd.get('password') });
    var st = document.getElementById('authStatus');
    if (res.ok) {
        st.className = 'form-status ok';
        st.innerText = 'Готово! Загружаю кабинет...';
        setTimeout(function () { location.reload(); }, 500);
    } else {
        st.className = 'form-status fail';
        st.innerText = res.error || 'Ошибка';
    }
};

document.getElementById('loginForm').onsubmit = async function (e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    var res = await apiPost('login', { email: fd.get('email'), password: fd.get('password') });
    var st = document.getElementById('authStatus');
    if (res.ok) {
        st.className = 'form-status ok';
        st.innerText = 'Успешный вход';
        setTimeout(function () { location.reload(); }, 300);
    } else {
        st.className = 'form-status fail';
        st.innerText = res.error || 'Ошибка';
    }
};

document.getElementById('logoutBtn').onclick = async function () {
    await apiGet('logout');
    location.reload();
};

(async function () {
    var me = await apiGet('me');
    if (me.ok && me.user) {
        document.getElementById('authBlock').style.display = 'none';
        document.getElementById('cabinetBlock').style.display = '';
        document.getElementById('userEmail').innerText = me.user;
        if (me.isAdmin) document.getElementById('adminLink').style.display = '';

        var orders = await apiGet('my-orders');
        var list = document.getElementById('ordersList');
        if (!orders.ok || orders.orders.length === 0) {
            list.innerHTML = '<p style="color:rgba(255,255,255,0.5);">Заказов пока нет</p>';
            return;
        }
        orders.orders.reverse().forEach(function (o) {
            var statusText = '', statusClass = '';
            if (o.status === 'pending') { statusText = '⏳ Ожидает одобрения'; statusClass = 'pending'; }
            if (o.status === 'approved') { statusText = '📨 Ожидает отправки'; statusClass = 'approved'; }
            if (o.status === 'completed') { statusText = '✅ Отправлено'; statusClass = 'completed'; }
            if (o.status === 'rejected') { statusText = '❌ Отклонено'; statusClass = 'rejected'; }

            var card = document.createElement('div');
            card.className = 'order-card';
            card.innerHTML =
                '<div class="order-head">' +
                    '<h3>' + escapeHtmlJs(o.name) + '</h3>' +
                    '<span class="order-status ' + statusClass + '">' + statusText + '</span>' +
                '</div>' +
                '<p><b>IP:</b> ' + escapeHtmlJs(o.ip) + ':' + escapeHtmlJs(o.port) + '</p>' +
                '<p><b>Контакт:</b> ' + escapeHtmlJs(o.contactType) + ' — ' + escapeHtmlJs(o.contact) + '</p>' +
                '<p><b>Создан:</b> ' + escapeHtmlJs(o.created_at) + '</p>' +
                (o.status === 'completed'
                    ? '<p style="color:#2ecc71;margin-top:10px;"><i class="fa-solid fa-circle-check"></i> Лаунчер отправлен тебе на контакт</p>'
                    : '');
            list.appendChild(card);
        });
    }
})();
</script>

    <script src="online-counter.js"></script>
</body>
</html>
